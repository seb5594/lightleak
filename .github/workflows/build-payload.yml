name: Build payload binaries
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-payload.yml
      - build-*.sh
      - build-stager-encrypt.py
      - requirements-build.txt
      - tests/verify-payloads.py
      - payload-stager/**
      - payload-proper/**
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-payload.yml
      - build-*.sh
      - build-stager-encrypt.py
      - requirements-build.txt
      - tests/verify-payloads.py
      - payload-stager/**
      - payload-proper/**

permissions:
  contents: read

concurrency:
  group: payload-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-clang-format:
    name: Lint with clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check code with clang-format
        uses: jidicula/clang-format-action@v4.5.0
        with:
          clang-format-version: "14"

  build:
    name: Build payload binaries
    runs-on: ubuntu-latest
    needs: lint-clang-format
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ltchiptool
        run: python -m pip install -r requirements-build.txt

      - name: Install GCC
        uses: fiam/arm-none-eabi-gcc@v1
        with:
          release: "7-2017-q4"

      - name: Build stager payloads
        run: |
          ./build-stager.sh bk7231t 0x1C5AC0 standard
          ./build-stager.sh bk7231n 0x1B5AC0 standard
          ./build-stager.sh bk7231n 0x1B5AC0 xor
          ./build-stager.sh bk7231n 0x1B5AC0 ip

      - name: Build proper payloads
        run: |
          ./build-proper.sh bk7231-proper-v1 bk7231t-proper-v1 BK7231T
          ./build-proper.sh bk7231-proper-v1 bk7231n-proper-v1 BK7231N

      - name: Verify payload binaries
        run: python tests/verify-payloads.py

      - name: Generate checksums
        working-directory: site
        run: sha256sum *.bin *.lst > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lightleak-bins
          if-no-files-found: error
          path: |
            site/*.bin
            site/*.lst
            site/SHA256SUMS

  deploy-pages:
    name: Deploy upstream binaries to GitHub Pages
    needs: build
    if: github.repository == 'tuya-cloudcutter/lightleak' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download payload binaries
        uses: actions/download-artifact@v4
        with:
          name: lightleak-bins
          path: site
      - name: Deploy binaries to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: tuya-cloudcutter/tuya-cloudcutter.github.io
          ssh-key: ${{ secrets.PAGES_SSH_KEY }}
          folder: site/
          target-folder: bins/
          force: false
